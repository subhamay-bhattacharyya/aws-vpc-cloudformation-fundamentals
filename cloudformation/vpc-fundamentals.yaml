AWSTemplateFormatVersion: '2010-09-09'

Description: 'Parent CloudFormation template that uses nested stacks to deploy VPC and subnet infrastructure'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Nested Stack Template Location"
        Parameters:
          - VPCTemplateS3Bucket
          - TemplatePrefix
      - Label:
          default: "Environment Configuration"
        Parameters:
          - ApplicationPrefix
          - EnvironmentName
      - Label:
          default: "VPC Configuration"
        Parameters:
          - VPCCidrBlock
          - EnableInternetGateway
          - EnableDnsHostnames
      - Label:
          default: "Public Subnet Configuration"
        Parameters:
          - PublicSubnetCount
          - PublicSubnetCidrBlocks
          - PublicSubnetAZ1
          - MapPublicIpOnLaunch
      - Label:
          default: "Network Configuration"
        Parameters:
          - EnableNACLs
    ParameterLabels:
      VPCTemplateS3Bucket:
        default: "VPC Nested Stack Template S3 Bucket"
      TemplatePrefix:
        default: "VPC Nested Stack Template S3 Prefix"
      ApplicationPrefix:
        default: "Application Prefix"
      EnvironmentName:
        default: "Environment Name"
      VPCCidrBlock:
        default: "VPC CIDR Block"
      PublicSubnetCount:
        default: "Public Subnet Count"
      PublicSubnetCidrBlocks:
        default: "Public Subnet CIDR Blocks"
      PublicSubnetAZ1:
        default: "Public Subnet Availability Zone"
      MapPublicIpOnLaunch:
        default: "Map Public IP on Launch"
      EnableNACLs:
        default: "Enable Network ACLs"

Parameters:
  VPCTemplateS3Bucket:
    Type: String
    Description: S3 bucket for the VPC networking nested stack template
    Default: subhamay-cfn-nested-templates-270453428528-devl-us-east-1
    AllowedPattern: ^[a-zA-Z0-9\-]+$
    ConstraintDescription: Must be a valid S3 bucket name

  TemplatePrefix:
    Type: String
    Description: S3 prefix for the VPC networking nested stack template
    Default: cfn-nested-aws-ha-multi-az-vpc-subnets

  ApplicationPrefix:
    Type: String
    Description: Application prefix for resource naming
    Default: web

  EnvironmentName:
    Type: String
    Description: Environment name
    Default: devl
    MinLength: 1
    MaxLength: 50

  VPCCidrBlock:
    Type: String
    Description: CIDR block for the VPC
    Default: 10.2.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR block

  EnableInternetGateway:
    Type: String
    Description: Enable Internet Gateway attachment to VPC
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableDnsHostnames:
    Type: String
    Description: Enable DNS hostnames and DNS support in VPC
    Default: 'true'
    AllowedValues: ['true', 'false']

  PublicSubnetCount:
    Type: String
    Description: Number of public subnets to create
    Default: '1'
    AllowedValues: ['0', '1', '2', '3', '4']

  PublicSubnetCidrBlocks:
    Type: String
    Description: CIDR blocks for public subnets (comma-separated)
    Default: 10.2.1.0/24

  PublicSubnetAZ1:
    Type: String
    Description: Availability Zone for first public subnet
    Default: us-east-1a

  MapPublicIpOnLaunch:
    Type: String
    Description: Auto-assign public IPv4 addresses to instances launched in public subnets
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableNACLs:
    Type: String
    Description: Enable Network ACLs for subnets
    Default: 'true'
    AllowedValues: ['true', 'false']

  CiSuffix:
    Type: String
    Description: CI/CD suffix for resource naming
    Default: ''

Resources:
  # Nested Stack for VPC Networking
  # This resource references an external VPC networking template stored in S3.
  # The nested stack creates and manages VPC, subnets, IGW, and routing infrastructure.
  # See: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-stack.html
  # cfn-lint: disable=W4001
  VPCNetworkingStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Template URL points to the VPC networking nested template in S3
      # Must be accessible and publicly readable (or role has permission to read)
      TemplateURL: !Sub https://${VPCTemplateS3Bucket}.s3.us-east-1.amazonaws.com/${TemplatePrefix}/vpc-networking.yaml

      # Parameters passed to the nested stack template
      # Maps parent stack parameters to nested template parameters
      Parameters:
        ApplicationPrefix: !Sub ${ApplicationPrefix}${CiSuffix}
        EnvironmentName: !Ref EnvironmentName
        VPCCidrBlock: !Ref VPCCidrBlock
        EnableInternetGateway: !Ref EnableInternetGateway
        EnableDnsHostnames: !Ref EnableDnsHostnames
        PublicSubnetCount: !Ref PublicSubnetCount
        PublicSubnetCidrBlocks: !Ref PublicSubnetCidrBlocks
        PublicSubnetAZ1: !Ref PublicSubnetAZ1
        MapPublicIpOnLaunch: !Ref MapPublicIpOnLaunch
        EnableNACLs: !Ref EnableNACLs
        PublicSubnetCidr: !Ref PublicSubnetCidrBlocks
        PublicSubnetNamePrefix: pub-subnet
        PublicRouteTableNamePrefix: pub-rt

      # Tags are propagated to all resources in the nested stack
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation
        - Key: ParentStack
          Value: !Ref AWS::StackName
        - Key: TemplateName
          Value: vpc-fundamentals
        - Key: CiSuffix
          Value: !Ref CiSuffix

      # Timeout for nested stack creation (in minutes)
      TimeoutInMinutes: 20

Outputs:
  VpcId:
    Description: VPC ID
    Value: !GetAtt VPCNetworkingStack.Outputs.VpcId
    Export:
      Name: !Sub '${AWS::StackName}-vpc-id'

  VpcCidrBlock:
    Description: VPC CIDR Block
    Value: !Ref VPCCidrBlock
    Export:
      Name: !Sub '${AWS::StackName}-vpc-cidr'

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !GetAtt VPCNetworkingStack.Outputs.InternetGatewayId
    Export:
      Name: !Sub '${AWS::StackName}-igw-id'

  PublicSubnetIds:
    Description: Public Subnet IDs
    Value: !GetAtt VPCNetworkingStack.Outputs.PublicSubnetIds
    Export:
      Name: !Sub '${AWS::StackName}-public-subnet-ids'

  PublicRouteTableId:
    Description: Public Route Table ID
    Value: !GetAtt VPCNetworkingStack.Outputs.PublicRouteTableId
    Export:
      Name: !Sub '${AWS::StackName}-public-rt-id'

  EnvironmentName:
    Description: Environment Name
    Value: !Ref EnvironmentName
    Export:
      Name: !Sub '${AWS::StackName}-environment'
